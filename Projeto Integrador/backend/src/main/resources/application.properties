spring.application.name=projeto-integrador-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/projeto_integrador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Conta de demonstração local. Altere por variáveis de ambiente fora do ambiente escolar.
app.demo.enabled=${DEMO_ACCOUNT_ENABLED:true}
app.demo.email=${DEMO_EMAIL:henry@senai.local}
app.demo.password=${DEMO_PASSWORD:123456}
app.auth.token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:90}
